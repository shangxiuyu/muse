<!doctype html><html><head><meta charset="utf-8"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data: blob:; font-src data:; connect-src 'none'; form-action 'none'; base-uri 'none'"></head><body><style>html,body{margin:0;width:100%;height:100%;background:#ece8dd}svg{display:block;width:100%;height:100%;object-fit:contain}</style><svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="t d"><title id="t">一束光的形状</title><desc id="d">午后阳光从右上高处斜落，在暖纸色墙面上形成一束被窗棂切成数条的硬边光带。光带向右下平移，被桌上一只陶土高颈花瓶的中段打断：瓶身左侧更亮，右腹留出一条未受光的暗带。瓶中插两枝墨绿橄榄叶。概念示例作品，品牌与项目均为虚构。</desc>
<defs>
<linearGradient id="paper" x1="0" y1="0" x2=".3" y2="1"><stop offset="0" stop-color="#f1eadb"/><stop offset=".5" stop-color="#e8dfcc"/><stop offset="1" stop-color="#dbcfb7"/></linearGradient>
<linearGradient id="sun" x1="0" y1="0" x2="1" y2=".5"><stop offset="0" stop-color="#fff9e6"/><stop offset="1" stop-color="#f6e8c4"/></linearGradient>
<linearGradient id="wallFall" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#6d6553" stop-opacity="0"/><stop offset="1" stop-color="#6d6553" stop-opacity=".13"/></linearGradient>
<linearGradient id="clay" x1=".12" y1="0" x2=".9" y2="1"><stop offset="0" stop-color="#c4613f"/><stop offset=".3" stop-color="#dd9a74"/><stop offset=".58" stop-color="#bd6746"/><stop offset="1" stop-color="#8f452e"/></linearGradient>
<linearGradient id="clayRim" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#8a4029"/><stop offset=".45" stop-color="#b85539"/><stop offset="1" stop-color="#7a3621"/></linearGradient>
<linearGradient id="table" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#d6c5a6"/><stop offset="1" stop-color="#bfaa88"/></linearGradient>
<linearGradient id="leafA" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#3d5438"/><stop offset="1" stop-color="#233320"/></linearGradient>
<linearGradient id="leafB" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#5d764c"/><stop offset="1" stop-color="#3c5137"/></linearGradient>
<radialGradient id="glow" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#fffaf0" stop-opacity=".8"/><stop offset="1" stop-color="#fffaf0" stop-opacity="0"/></radialGradient>
<filter id="soft" x="-30%" y="-60%" width="160%" height="240%"><feGaussianBlur stdDeviation="9"/></filter>
<filter id="soft2" x="-30%" y="-40%" width="160%" height="180%"><feGaussianBlur stdDeviation="3.4"/></filter>
<!-- 陶瓶外轮廓：颈壁与瓶腹由同一条壁线构成，单条闭合成形 -->

</defs>

<rect width="1440" height="900" fill="url(#paper)"/>

<path d="M812 410q12 130-4 300" stroke="#8c3f26" stroke-width="7" fill="none" opacity=".46"/>

<path d="M712 428q36-15 108-3" stroke="#8c3f26" stroke-width="2.4" fill="none" opacity=".3" stroke-linecap="round"/>

<ellipse cx="752" cy="440" rx="15" ry="6.5" fill="#2c1409" opacity=".5" transform="rotate(-9 752 440)"/>
<ellipse cx="766" cy="447" rx="12" ry="5.5" fill="#2c1409" opacity=".42" transform="rotate(-11 766 447)"/>

<ellipse cx="716" cy="478" rx="20" ry="34" fill="#fff0d8" opacity=".2" transform="rotate(-14 716 478)"/>

<g transform="translate(1196 742) rotate(-16)">
<path d="M0 0q34-20 62 6-30 22-62-6Z" fill="url(#leafA)"/>
<path d="M2 2 56 4" stroke="#2c3e29" stroke-width="2"/>
</g>
<ellipse cx="1228" cy="756" rx="44" ry="7" fill="#6b5f47" opacity=".18" filter="url(#soft2)"/>

<text x="82" y="248" fill="#3f4636" font-family="'Songti SC','Noto Serif SC',Georgia,serif" font-size="70" letter-spacing="2">一束光的形状</text>

<path d="M86 330h44" stroke="#a8754e" stroke-width="3"/>
<g font-family="'Songti SC','Noto Serif SC',Georgia,serif" fill="#5c5847">
<text x="84" y="800" font-size="15.5">午后，窗棂把一束光切成条，落在陶土与叶上。</text>
<text x="84" y="826" font-size="15.5" opacity=".82">光不是背景；它被物体打断，于是有了形状。</text>
</g>
