# 个人负面禁忌库 (Personal Taboos & Redlines)
# 一票否决项：检测到以下模式直接拦截

taboos:
  ui_patterns:
    # "大面积光晕"定量判定：覆盖视口 >20%、或峰值透明度 >0.1、或无交互常驻渲染——满足任一条即违规。
    # 半径 ≤400px、透明度 ≤0.08、仅 hover 跟随光标的局部微光（Spotlight）不在此列。
    - "禁止背景使用任何大面积高斯模糊彩色光晕 (Ambient Blur Blobs)"
    - "禁止死板居中的小药丸标签+居中大粗标题+居中双按钮三板斧"
    - "禁止悬浮红黄绿三圆点的假 MacOS 窗口模型"
    # "8 态闭环"权威定义见 references/toolkit/ui_product_tool.md 状态矩阵节：
    # default / hover / active / focus-visible / disabled / loading / error / empty
    - "禁止缺乏 8 态闭环的半成品组件代码"
    # 阴影判定：blur ≤36px 且透明度 ≤0.1 的微弥散阴影允许；超出即为"厚重脏阴影"
    - "禁止厚重脏阴影与无光源逻辑的黑色死投影"
    - "禁止按钮滥用假高光扫光动画与强烈渐变发光"

  text_patterns:
    - "禁止假大空抒情与空洞修饰词堆叠"
    - "禁止虚假捏造背书与虚假转化率数据"
    - "禁止连续使用超过 3 个逗号的无呼吸长句"

  visual_patterns:
    - "禁止光滑无毛孔塑料假人脸"
    - "禁止过饱和糖水风无景深 3D 贴图"
